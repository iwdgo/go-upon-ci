name: image test
on: [push]
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go
      uses: actions/setup-go@v5
      if: true
      with:
        go-version: 1.22.x
      id: go

    - uses: actions/checkout@v4
    - name: Enable KVM group perms
      if: false
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Test in FreeBSD
      run: |
        sudo apt install qemu-system-x86 virt-manager
        freebsdrel=FreeBSD-14.2-RELEASE-amd64.qcow2
        wget https://download.freebsd.org/ftp/releases/VM-IMAGES/14.2-RELEASE/amd64/Latest/FreeBSD-14.2-RELEASE-amd64.qcow2.xz
        unxz $freebsdrel.xz
        ls
        qemu-img resize $freebsdrel +2G
        ls
        # 
        # nbd devices on Github runner
        # mount -t ufs -o ufstype=ufs2,rw /dev/nbd0p4 /mnt
        #
        # echo 'console="comconsole"' >> /mnt/boot/loader.conf
        # umount /mnt
        # TODO Fails on "we need a console"
        # sudo qemu-system-x86_64 -drive file=$freebsdrel,format=qcow2 \
        # -nographic -display curses \
        # -enable-kvm \
        # -serial mon:stdio \
        # -serial telnet:127.0.0.1:4444,server,nowait \
        # -append 'console=ttyS0' \
        # -monitor unix:console.sock,server,nowait
        # -serial mon:stdio \
        # -serial unix:console.sock,server,nowait \
        # -serial telnet:127.0.0.1:4444,server,nowait
        ## Same using virt
        sudo mv $freebsdrel /var/lib/libvirt/images/
        qemu-img resize /var/lib/libvirt/images/FreeBSD-14.2-RELEASE-amd64.qcow2 +2G
        sudo virt-install --connect qemu:///system \
          --name freebsd142 \
          --memory 2048 \
          --osinfo freebsd14.2 \
          --network network=default,model=e1000,model=virtio \
          --nographics \
          --virt-typ qemu \
          --location /var/lib/libvirt/images/$freebsdrel \
          --import \
          --extra-args 'console=ttyS0,115200n8 serial'
        telnet localhost 4444
        uname -a
        whoami
        quit
